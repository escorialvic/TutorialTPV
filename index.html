<!DOCTYPE html>
<html lang="ca" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cada tarda una aventura · Guia per a famílies</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --burg:#821E34; --mag:#FF004E; --ink:#2D2926; --soft:#6B625B; --tint:#F8E8EE; --line:#E4DCD9;
  --bg:#F4F1ED; --card:#FFFFFF; --ok:#2E9F48; --okbg:#E8F6EC;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0; min-height:100%; background:var(--bg); color:var(--ink);
  font-family:"Titillium Web","Segoe UI",system-ui,sans-serif; font-size:19px; line-height:1.5}
.wrap{max-width:560px; margin:0 auto; padding:16px 18px 120px}
header{display:flex; justify-content:center; padding:10px 0 14px; border-bottom:4px solid var(--burg)}
header img{height:46px; width:auto; display:block}
h1{font-size:30px; line-height:1.1; font-weight:700; color:var(--burg); margin:24px 0 6px}
.lead{color:var(--soft); margin:0 0 22px; font-size:18px}
.choice{display:flex; gap:14px; align-items:center; width:100%; text-align:left; background:var(--card);
  border:2px solid var(--line); border-radius:20px; padding:18px; margin:0 0 14px; font:inherit; color:inherit; cursor:pointer}
.choice .ic{flex:0 0 52px; height:52px; border-radius:16px; display:grid; place-items:center; background:var(--mag); color:#fff; font-weight:700; font-size:24px}
.choice b{display:block; font-size:20px; font-weight:700; color:var(--burg); line-height:1.15}
.choice span{color:var(--soft); font-size:16px}
.help{margin-top:24px; background:var(--tint); border-radius:16px; padding:16px 18px; font-size:17px}
.help a{color:var(--mag); font-weight:700}
.top{display:flex; align-items:center; gap:10px; margin:14px 0 4px}
.back{border:0; background:none; color:var(--mag); font:inherit; font-weight:700; padding:8px 4px; cursor:pointer}
.count{color:var(--mag); font-weight:700; font-size:16px; margin-left:auto}
.bar{height:10px; background:var(--line); border-radius:10px; overflow:hidden; margin:6px 0 18px}
.bar i{display:block; height:100%; background:var(--mag); border-radius:10px; transition:width .3s}
.num{display:inline-grid; place-items:center; width:46px; height:46px; border-radius:50%; background:var(--mag); color:#fff; font-weight:700; font-size:24px; margin-bottom:10px}
h2{font-size:26px; line-height:1.15; font-weight:700; color:var(--burg); margin:0 0 10px}
.txt{margin:0 0 16px}
.txt strong{font-weight:700}
.note{background:var(--tint); border-left:6px solid var(--mag); border-radius:12px; padding:12px 14px; font-size:17px; margin:0 0 16px}
.video{display:block; width:100%; max-width:330px; margin:0 auto 6px; border-radius:16px; background:#000}
.vnote{text-align:center; color:var(--soft); font-size:16px; margin:0 0 10px}
.shot{display:block; margin:0 auto; width:250px; max-width:100%; border-radius:14px; border:1px solid var(--line)}
.appicon{display:block; margin:0 auto 14px; width:120px; border-radius:26px}
.nav{position:fixed; left:0; right:0; bottom:0; background:var(--bg); border-top:1px solid var(--line);
  padding:12px 18px calc(12px + env(safe-area-inset-bottom,0px)); display:flex; gap:12px; justify-content:center}
.nav button{flex:1; max-width:262px; font:inherit; font-weight:700; font-size:19px; border-radius:16px; padding:16px; cursor:pointer; border:2px solid var(--mag)}
.prev{background:var(--card); color:var(--mag)}
.next{background:var(--mag); color:#fff}
.nav button:disabled{opacity:.35}
.checks label{display:flex; align-items:center; gap:14px; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:13px 15px; margin:0 0 10px; font-weight:600; cursor:pointer}
.checks input{width:26px; height:26px; accent-color:var(--ok)}
.checks label:has(input:checked){background:var(--okbg); border-color:var(--ok)}
.done{display:none; text-align:center; font-weight:700; color:var(--ok); font-size:20px; margin-top:6px}
.done.show{display:block}
.contact{display:flex; gap:10px; flex-wrap:wrap; margin:0}
.contact a{flex:1 1 190px; text-align:center; text-decoration:none; background:var(--card); border:2px solid var(--mag); color:var(--mag); font-weight:700; border-radius:14px; padding:12px}
[hidden]{display:none !important}
</style>
</head>

    <div class="note">No teniu usuari? Truqueu a Vadelleure: <a href="tel:+34938634658">93 863 46 58</a></div>`},
  {n:4, t:"Toqueu «Serveis»", h:shot(f,4)},
]);

const FLOWS = {
  inscripcio: [ VIDEO("video-inscripcio.mp4","Vídeo: com fer la inscripció"), APP, ...LOGIN("ins"),
    {n:5, t:"Inscripcions", h:`<p class="txt">Toqueu <strong>«Inscripcions»</strong> i després <strong>«Acollida-Cada Tarda una Aventura»</strong>.</p>${shot("ins",5)}`},
    {n:6, t:"Trieu el formulari", h:`<p class="txt">Trieu <strong>«CADA TARDA UNA AVENTURA I EXTRAESCOLARS 2026/2027»</strong> i toqueu <strong>«FER INSCRIPCIÓ»</strong>.</p>${shot("ins",6)}`},
    {n:7, t:"Trieu serveis i horaris", h:`<p class="txt">Marqueu els <strong>serveis i els horaris</strong> que us interessen.</p>${shot("ins",7)}`},
    {n:8, t:"Reviseu i continueu", h:`<p class="txt">Comproveu el resum i l'import, i toqueu <strong>«SEGÜENT»</strong>.</p>${shot("ins",8)}`},
    {n:9, t:"Algun germà o germana?", h:`<p class="txt">Si en voleu inscriure un altre, toqueu <strong>«SÍ»</strong>. Si no, toqueu <strong>«NO»</strong>.</p>${shot("ins",9)}`},
    {n:10, t:"Pagueu i finalitzeu", h:`<p class="txt">Introduïu les dades de la targeta i toqueu <strong>«FINALITZAR»</strong>.</p>${shot("ins",10)}`},
    {t:"I ara, els dies", h:`<p class="txt"><strong>La inscripció no reserva cap dia.</strong> Cal reservar a l'app els dies que hi anirà, un per un.</p>
      <p class="contact"><a href="#" id="to-reserva">Veure com reservar els dies</a></p>`, last:true},
  ],
  reserva: [ VIDEO("video-reserva.mp4","Vídeo: com reservar els dies"), ...LOGIN("res"),
    {n:5, t:"Acollida-Cada Tarda una Aventura", h:`<p class="txt">Toqueu <strong>«Acollida-Cada Tarda una Aventura»</strong>.</p>${shot("res",5)}`},
    {n:6, t:"Toqueu els dies", h:`<p class="txt">Al calendari, toqueu <strong>tots els dies</strong> que hi anirà.</p>${shot("res",6)}`},
    {n:7, t:"Confirmeu els dies", h:`<p class="txt">Comproveu els dies marcats i toqueu <strong>«CONFIRMAR DIES»</strong>.</p>${shot("res",7)}`},
    {n:8, t:"Pagueu", h:`<p class="txt">Trieu <strong>targeta o Bizum</strong> i acabeu el pagament.</p>${shot("res",8)}`},
    {n:9, t:"Comproveu que són verds", h:`<div class="note">Els dies reservats es posen de color <strong>VERD</strong>. Si un dia no és verd, no està reservat.</div>${shot("res",9)}`},
    {n:10, t:"Aviseu el tutor/a", h:`<p class="txt"><strong>Reservar el dia no és suficient.</strong> Aviseu també el tutor/a indicant quin dia o dies es quedarà a l'activitat.</p>`},
    {t:"Comproveu-ho", h:`<p class="txt">Marqueu cada punt quan l'hàgiu fet:</p><div class="checks">
      <label><input type="checkbox"> Dies confirmats</label>
      <label><input type="checkbox"> Pagament fet</label>
      <label><input type="checkbox"> Dies en verd</label>
      <label><input type="checkbox"> Tutor/a avisat</label></div><p class="done" id="done">Tot fet. Gràcies!</p>`, last:true},
  ]
};

let flow=null, i=0;
const $=id=>document.getElementById(id);
function render(){
  const s=FLOWS[flow][i], total=FLOWS[flow].length;
  $("step").innerHTML=(s.n?`<div class="num">${s.n}</div>`:"")+`<h2>${s.t}</h2>`+s.h;
  $("count").textContent=`${i+1} / ${total}`;
  $("bar").style.width=((i+1)/total*100)+"%";
  $("prev").disabled=i===0;
  $("next").textContent=s.last?"Acabar":"Següent";
  const boxes=$("step").querySelectorAll('input[type=checkbox]'), done=$("done");
  if(done) boxes.forEach(b=>b.addEventListener('change',()=>done.classList.toggle('show',[...boxes].every(x=>x.checked))));
  const link=$("to-reserva");
  if(link) link.addEventListener('click',e=>{e.preventDefault();go('reserva');});
  window.scrollTo(0,0);
}
function go(f){flow=f;i=0;$("home").hidden=true;$("flow").hidden=false;$("nav").hidden=false;render();}
function home(){$("home").hidden=false;$("flow").hidden=true;$("nav").hidden=true;window.scrollTo(0,0);}
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
$("home-btn").onclick=home;
$("prev").onclick=()=>{if(i>0){i--;render();}};
$("next").onclick=()=>{if(i<FLOWS[flow].length-1){i++;render();}else home();};
</script>
</body>
</html>
